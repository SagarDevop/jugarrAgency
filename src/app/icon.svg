<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#0C0C0E" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#E53935" flood-opacity="0.45" />
    </filter>
  </defs>
  <!-- Background Container -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="125" height="125" rx="26.5" fill="none" stroke="#2A2A30" stroke-width="2.5" />

  <!-- The 'j' Lettermark -->
  <!-- Top Dot of j -->
  <circle cx="50" cy="31" r="8.5" fill="#F4F4F2" />

  <!-- Stem & Sweeping Hook of j -->
  <path
    d="M 50 48 V 83 C 50 94.5 42 101.5 30 101.5 C 22 101.5 15.5 98 13 93"
    fill="none"
    stroke="#F4F4F2"
    stroke-width="15"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- The Iconic Jugarr Accent Dot '.' -->
  <circle cx="91" cy="83" r="10.5" fill="#E53935" filter="url(#glow)" />
</svg>
